<!DOCTYPE html>
<!-- The threads page. Every submission is a thread. Opening one shows what the reviewer circled
     or moved (the before and after pictures and the numbers), what the assistant replied, the
     pictures the assistant rendered from the reviewer's own camera, and a box for a follow-up.
     It is served by the same bench server as the review page. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads</title>
<style>
  :root { --bg:#0e1316; --panel:#161d22; --line:#26323a; --ink:#e8eef2; --dim:#8fa3b0;
          --go:#7fd8c0; --warn:#e8963c; --asst:#6ea8e0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #wrap { display:flex; height:100vh; }
  #list { width:340px; flex:0 0 340px; border-right:1px solid var(--line); overflow:auto; }
  #detail { flex:1; overflow:auto; padding:16px 18px 40px; }
  .filters { display:flex; gap:6px; padding:10px; position:sticky; top:0; background:var(--bg);
             border-bottom:1px solid var(--line); flex-wrap:wrap; z-index:2; }
  .filters button { background:#1b242a; color:var(--ink); border:1px solid var(--line);
                    border-radius:7px; padding:5px 9px; font-size:12px; cursor:pointer; }
  .filters button[aria-pressed="true"] { background:var(--go); color:#08201b; border-color:var(--go);
                                          font-weight:650; }
  .row { padding:9px 11px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover { background:#141c21; }
  .row[aria-current="true"] { background:#18242b; box-shadow:inset 3px 0 0 var(--go); }
  .row .top { display:flex; gap:7px; align-items:baseline; }
  .row .part { color:var(--warn); font-weight:650; font-size:12px; }
  .row .when { color:var(--dim); font-size:11px; font-family:ui-monospace, monospace; }
  .row .said { color:var(--dim); font-size:12px; margin-top:2px;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chip { font-size:10px; padding:1px 6px; border-radius:99px; border:1px solid var(--line);
          color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .chip.new { color:var(--warn); border-color:#5a3d1c; background:#241a0e; }
  .chip.answered { color:var(--asst); border-color:#27405c; background:#111c26; }
  .chip.fixed { color:var(--go); border-color:#1e4a41; background:#0e211d; }
  .chip.wont { color:#c98; }
  h2 { margin:0 0 2px; font-size:16px; }
  .meta { color:var(--dim); font-size:12px; font-family:ui-monospace, monospace; margin-bottom:12px; }
  .rev { border-left:3px solid var(--warn); padding:8px 12px; background:#151c21; border-radius:0 8px 8px 0; }
  .asst { border-left:3px solid var(--asst); padding:8px 12px; background:#131a20; border-radius:0 8px 8px 0; }
  .turn { margin:12px 0; }
  .turn .who { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em;
               margin-bottom:3px; }
  .shots { display:flex; gap:10px; margin:10px 0; flex-wrap:wrap; }
  .shots figure { margin:0; flex:1 1 300px; }
  .shots figcaption { font-size:11px; color:var(--dim); font-family:ui-monospace, monospace; }
  img.shot { width:100%; border:1px solid var(--line); border-radius:8px; display:block; cursor:zoom-in; }
  pre.nums { font:11px/1.4 ui-monospace, monospace; color:var(--dim); background:#121a1f;
             border:1px solid var(--line); border-radius:8px; padding:8px 10px; overflow:auto; margin:8px 0; }
  textarea { width:100%; min-height:70px; background:#121a1f; color:var(--ink);
             border:1px solid var(--line); border-radius:8px; padding:9px; font:inherit; resize:vertical; }
  #send { margin-top:8px; background:var(--go); color:#08201b; border:0; border-radius:8px;
          padding:9px 14px; font-weight:650; cursor:pointer; }
  #send[disabled] { opacity:.45; cursor:default; }
  #msg { color:var(--go); font:12px ui-monospace, monospace; margin-left:8px; }
  .empty { color:var(--dim); padding:24px; }
  #zoom { position:fixed; inset:0; background:#000d; display:none; align-items:center;
          justify-content:center; z-index:9; cursor:zoom-out; }
  #zoom img { max-width:96vw; max-height:96vh; }
  @media (max-width: 760px) {
    #wrap { flex-direction:column; height:auto; }
    #list { width:auto; flex:none; max-height:40vh; border-right:0; border-bottom:1px solid var(--line); }
    #detail { padding:12px; }
  }
</style>

<div id="wrap">
  <div id="list">
    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="new" aria-pressed="false">Waiting</button>
      <button data-f="answered" aria-pressed="false">Answered</button>
      <button data-f="fixed" aria-pressed="false">Fixed</button>
    </div>
    <div id="rows"></div>
  </div>
  <div id="detail"><div class="empty">Pick one of your comments on the left.</div></div>
</div>
<div id="zoom"><img alt=""></div>

<script>
let THREADS = [], filter = 'all', openId = null;

const esc = t => (t || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = iso => (iso || '').slice(11, 16);
const day = iso => (iso || '').slice(0, 10);

async function loadList(keepOpen) {
  const j = await (await fetch('/api/threads', {cache:'no-store'})).json();
  THREADS = j.threads || [];
  const rows = document.getElementById('rows');
  const show = THREADS.filter(t => filter === 'all' || t.state === filter);
  rows.innerHTML = show.length ? '' : '<div class="empty">nothing here</div>';
  for (const t of show) {
    const d = document.createElement('div');
    d.className = 'row';
    d.dataset.id = t.id;
    if (t.id === openId) d.setAttribute('aria-current', 'true');
    d.innerHTML = '<div class="top"><span class="part">' + esc(t.part || '?') + '</span>'
      + '<span class="when">' + day(t.at) + ' ' + clock(t.at) + '</span>'
      + '<span class="chip ' + t.state + '">' + t.state + '</span>'
      + (t.replies ? '<span class="when">' + t.replies + ' repl</span>' : '') + '</div>'
      + '<div class="said">' + esc(t.said || ('(' + (t.kind || 'change') + ', no words)')) + '</div>';
    d.onclick = () => open(t.id);
    rows.appendChild(d);
  }
  if (!keepOpen && !openId && show.length) open(show[0].id);
}

function numbers(d) {
  const out = [];
  if (d.mark) out.push('circled ' + (d.mark.r_mm) + ' mm at [' + (d.mark.at || []).map(v => v.toFixed ? v.toFixed(2) : v).join(', ') + '] on ' + d.mark.part);
  const c = d.change;
  if (c) {
    if (c.move_len_mm > 0.0005) out.push('moved ' + c.move_len_mm.toFixed(2) + ' mm [' + c.move_mm.join(', ') + ']');
    if (c.turn_deg > 0.005) out.push('turned ' + c.turn_deg.toFixed(1) + '° about ' + (c.turn_axis_named || '') + ' [' + c.turn_axis.join(', ') + ']');
    if (Math.abs((c.scale ?? 1) - 1) > 0.0005) out.push('size ×' + c.scale);
    if (c.space) out.push('in ' + c.space + ' space');
  }
  if (d.camera && d.camera.eye) out.push('camera eye [' + d.camera.eye.join(', ') + '] looking at [' + d.camera.at.join(', ') + ']');
  out.push('stage: ' + d.stage);
  return out.join('\n');
}

async function open(id) {
  openId = id;
  for (const r of document.querySelectorAll('.row'))
    r.setAttribute('aria-current', String(r.dataset.id === id));
  const el = document.getElementById('detail');
  el.innerHTML = '<div class="empty">opening…</div>';
  const d = await (await fetch('/api/thread/' + id, {cache:'no-store'})).json();
  if (d.error) { el.innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }

  let h = '<h2>' + esc(d.part || '?') + ': ' + (d.kind === 'mark' ? 'a spot you circled' : 'a change you made') + '</h2>';
  h += '<div class="meta">' + esc(d.id) + ' · ' + esc(d.at || '') + ' · <span class="chip ' + d.state + '">' + d.state + '</span></div>';
  h += '<div class="turn rev"><div class="who">you said</div>' + (d.said ? esc(d.said) : '<i>(no words)</i>') + '</div>';
  h += '<pre class="nums">' + esc(numbers(d)) + '</pre>';
  if (d.shots) {
    h += '<div class="shots">'
      + '<figure><img class="shot" src="/api/sub/' + d.shots.before + '" alt="before"><figcaption>before, as built</figcaption></figure>'
      + '<figure><img class="shot" src="/api/sub/' + d.shots.after + '" alt="after"><figcaption>after, as you moved it</figcaption></figure>'
      + '</div>';
  }
  for (const t of (d.thread || [])) {
    h += '<div class="turn ' + (t.by === 'assistant' ? 'asst' : 'rev') + '">'
       + '<div class="who">' + (t.by === 'assistant' ? 'assistant' : 'you') + ' · ' + esc((t.at || '').slice(0, 16).replace('T', ' ')) + '</div>'
       + esc(t.text).replace(/\n/g, '<br>');
    if (t.did) h += '<pre class="nums">' + esc(typeof t.did === 'string' ? t.did : JSON.stringify(t.did, null, 1)) + '</pre>';
    if (t.shot) h += '<div class="shots"><figure><img class="shot" src="/api/sub/' + t.shot + '" alt="the change"><figcaption>the change, from your camera. The old position is the orange shadow</figcaption></figure></div>';
    h += '</div>';
  }
  h += '<div style="margin-top:16px"><textarea id="say" placeholder="Reply here. It stays on this comment"></textarea>'
     + '<button id="send">Send follow-up</button><span id="msg"></span></div>';
  el.innerHTML = h;
  el.scrollTop = 0;
  document.getElementById('send').onclick = send;
  for (const im of el.querySelectorAll('img.shot')) im.onclick = () => zoom(im.src);
}

function zoom(src) {
  const z = document.getElementById('zoom');
  z.querySelector('img').src = src;
  z.style.display = 'flex';
}
document.getElementById('zoom').onclick = () => { document.getElementById('zoom').style.display = 'none'; };

async function send() {
  const t = document.getElementById('say').value.trim();
  if (!t || !openId) return;
  const b = document.getElementById('send'), m = document.getElementById('msg');
  b.disabled = true; m.textContent = 'sending…';
  try {
    const r = await fetch('/api/comment', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: openId, text: t})});
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    m.textContent = 'sent';
    await open(openId);
    loadList(true);
  } catch (e) { m.textContent = 'could not send: ' + e.message; b.disabled = false; }
}

for (const b of document.querySelectorAll('#filters button'))
  b.onclick = () => {
    filter = b.dataset.f;
    for (const o of document.querySelectorAll('#filters button'))
      o.setAttribute('aria-pressed', String(o === b));
    loadList(true);
  };

loadList();
/* replies can arrive while the page is open, so the list refreshes itself */
setInterval(() => { loadList(true); if (openId) { /* refresh open thread quietly */ } }, 15000);
</script>
